name: Fetch source data

# Downloads every URL listed in data/fetch.tsv on GitHub's runners and
# attaches the files, plus REPORT.txt (status, size, first lines), to a draft
# release named "source-data". Draft releases aren't public. Used to pull
# source files from hosts a development environment can't reach.
on:
  push:
    paths: [data/fetch.tsv, .github/workflows/fetch-data.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          : > out/REPORT.txt
          grep -v '^#' data/fetch.tsv | while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            code=$(curl -sSL --retry 3 --max-time 900 -A "orphaned-well-map/1.0" -o "out/$name" -w '%{http_code} %{content_type} %{url_effective}' "$url" 2>&1) || true
            {
              echo "=== $name"
              echo "url: $url"
              echo "result: $code"
              echo "size: $(stat -c %s "out/$name" 2>/dev/null || echo 0)"
              file -b "out/$name" 2>/dev/null || true
              if file -b "out/$name" | grep -qi zip; then unzip -l "out/$name" | head -40; fi
              if file -b "out/$name" | grep -qiE 'text|csv'; then head -c 1500 "out/$name"; echo; fi
            } >> out/REPORT.txt
          done
          cat out/REPORT.txt
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view source-data >/dev/null 2>&1 || \
            gh release create source-data --draft --title "Source data cache" \
              --notes "Raw downloads from data/fetch.tsv. Not a product release."
          gh release upload source-data out/* --clobber
